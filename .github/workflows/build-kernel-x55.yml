name: Build Kernel Only - Powkiddy X55

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: next
          fetch-depth: 1

      - name: Install cross-compile tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex gcc-aarch64-linux-gnu git libelf-dev libncurses-dev libssl-dev lzop make python3 rsync xz-utils zstd pahole

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 4G
          key: kernel-rk3566-x55-6.15

      - name: Read kernel version
        run: |
          PKG_VERSION=$(awk '/^\s*\*\)/{found=1} found && /PKG_VERSION=/{match($0, /PKG_VERSION="([^"]+)"/, a); print a[1]; exit}' packages/linux/package.mk)
          echo "Kernel version: $PKG_VERSION"
          echo "KERNEL_VERSION=${PKG_VERSION}" >> $GITHUB_ENV

      - name: Download kernel source
        run: |
          MAJOR=$(echo $KERNEL_VERSION | cut -d. -f1)
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${KERNEL_VERSION}.tar.xz"
          tar xf linux-${KERNEL_VERSION}.tar.xz
          mv linux-${KERNEL_VERSION} linux-src

      - name: Apply ROCKNIX patches
        run: |
          cd linux-src
          for patch in $(ls ../packages/linux/patches/default/*.patch 2>/dev/null | sort); do
            echo "Applying: $(basename $patch)"
            patch -p1 --forward < "$patch" || true
          done

      - name: Setup kernel config
        run: |
          cp projects/ROCKNIX/devices/RK3566/linux/linux.aarch64.conf linux-src/.config
          cd linux-src

          # Clear initramfs (not available in standalone build)
          sed -i 's|^CONFIG_INITRAMFS_SOURCE=.*|CONFIG_INITRAMFS_SOURCE=""|' .config

          # Force DSI/PHY drivers as built-in (=y) to fix EPROBE_DEFER error
          # These must be built-in, NOT modules, so DSI host can find PHY at boot
          scripts/config --enable CONFIG_PHY_ROCKCHIP_INNO_DSIDPHY
          scripts/config --enable CONFIG_PHY_ROCKCHIP_SAMSUNG_DCPHY
          scripts/config --enable CONFIG_DRM_ROCKCHIP
          scripts/config --enable CONFIG_ROCKCHIP_DW_MIPI_DSI
          scripts/config --enable CONFIG_DRM_PANEL_HIMAX_HX8394
          scripts/config --disable CONFIG_PHY_ROCKCHIP_INNO_DSIDPHY_MODULE || true
          scripts/config --disable CONFIG_DRM_ROCKCHIP_MODULE || true

          echo "=== DSI/PHY config check ==="
          grep -E "PHY_ROCKCHIP|DRM_ROCKCHIP|MIPI_DSI|HX8394" .config || true

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "=== After olddefconfig DSI/PHY config check ==="
          grep -E "PHY_ROCKCHIP|DRM_ROCKCHIP|MIPI_DSI|HX8394" .config || true

      - name: Build kernel
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          cd linux-src
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== BUILD ERRORS ==="
            grep -E "error:|Error |undefined|cannot find|fatal:" /tmp/build.log | grep -v "Makefile:" | tail -30
            echo "=== END ERRORS ==="
            exit $BUILD_EXIT
          fi
          ls -lh arch/arm64/boot/Image

      - name: Collect output
        run: |
          mkdir -p output/device_trees
          cp linux-src/arch/arm64/boot/Image output/KERNEL
          find linux-src/arch/arm64/boot/dts/rockchip/ -name "rk3566-powkiddy-x55.dtb" -exec cp {} output/device_trees/ \; 2>/dev/null || true
          ls -lh output/
          ls -lh output/device_trees/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KERNEL-rk3566-x55-${{ github.run_number }}
          path: output/
          retention-days: 30
